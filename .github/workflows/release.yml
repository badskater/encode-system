# Continuous delivery: tagged releases produce the deploy bundle + GHCR image.
#
# Outputs per tag (v*):
#   1. GitHub release assets:
#      - encode-system-<ver>-deploy.tar.gz  (complete offline deploy bundle:
#        controller, agent (windows + linux), ui/, provision/,
#        Dockerfile.runtime, docker-compose.runtime.yml, .env.example,
#        install.sh, install-agent.ps1, install-agent.sh, EncodeLib.ps1,
#        SHA256SUMS)
#      - controller, encode-agent.exe, encode-agent-linux-amd64, install.sh,
#        install-agent.ps1, install-agent.sh, SHA256SUMS (loose files for
#        direct one-liner installs)
#   2. Container image: ghcr.io/<owner>/encode-system:<ver> + :latest
#      (built from docker/Dockerfile — Go controller + SPA + provision).
#
# The fleet's Docker host sits on a private LAN; pulling the GHCR image is an
# explicit operator action (install.sh does `compose pull || build`), never an
# automated push to production.
#
# Trigger: push a version tag, e.g. `git tag v1.17.0 && git push origin v1.17.0`.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Build provenance attestations (security audit 2026-10): signed,
  # tamper-evident proof of which workflow run produced each binary/image.
  # Verify with: gh attestation verify dist/encode-agent.exe -R <owner/repo>
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build release bundle + image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Backend binaries — same flags as the manual deploys.
      - name: Build controller (linux/amd64)
        working-directory: backend
        run: >
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build
          -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"
          -o ../dist/controller ./cmd/controller

      - name: Build agent (windows/amd64)
        working-directory: backend
        run: >
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build
          -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"
          -o ../dist/encode-agent.exe ./cmd/agent

      - name: Build agent (linux/amd64)
        working-directory: backend
        run: >
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false
          -ldflags "-X main.Version=${{ steps.ver.outputs.version }}"
          -o ../dist/encode-agent-linux-amd64 ./cmd/agent

      # Frontend SPA.
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r dist ../dist/ui

      # --- complete deploy bundle -------------------------------------------
      - name: Assemble bundle
        run: |
          mkdir -p dist/provision dist/provision/roles dist/systemd
          cp infra/ansible/provision.yml dist/provision/
          # Linux provisioning tree: the engine (executeLinux) reads
          # PlaybookDir/linux-node.yml and copies PlaybookDir/roles/linux-node/
          # into the run dir for ansible role resolution. mkdir roles/ first:
          # `cp -r linux-node dest/` flattens into dest/ when dest/ is absent.
          cp infra/ansible/linux-node.yml dist/provision/
          cp -r infra/ansible/roles/linux-node dist/provision/roles/
          # systemd unit: stageSystemdUnit's FIRST resolution path is
          # PlaybookDir/../systemd/encode-agent.service. With PlaybookDir
          # = /app/provision (Dockerfile.runtime + Dockerfile) that resolves
          # to /app/systemd/encode-agent.service, so the unit ships as a
          # SIBLING of provision/ in the bundle (dist/systemd/). install.sh
          # copies it next to provision/ in HOME_DIR, and Dockerfile.runtime
          # COPYs it to /app/systemd.
          cp infra/systemd/encode-agent.service dist/systemd/
          cp docker/Dockerfile.runtime dist/
          cp docker/docker-compose.runtime.yml dist/
          cp docker/.env.example dist/
          cp docker/install.sh dist/
          cp docker/install-agent.ps1 dist/
          cp docker/install-agent.sh dist/
          cp powershell/EncodeLib.ps1 dist/
          # Checksums cover the binaries (install.sh verifies these).
          (cd dist && sha256sum controller encode-agent.exe encode-agent-linux-amd64 > SHA256SUMS)

      - name: Pack bundle tarball
        run: |
          tar -czf "dist/encode-system-${{ steps.ver.outputs.version }}-deploy.tar.gz" -C dist \
            controller encode-agent.exe encode-agent-linux-amd64 ui provision systemd \
            Dockerfile.runtime docker-compose.runtime.yml .env.example \
            install.sh install-agent.ps1 install-agent.sh EncodeLib.ps1 SHA256SUMS

      # --- GHCR image ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            AGENT_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      # Signed build provenance for the container image (same root of trust
      # as the binaries — GitHub Actions OIDC identity).
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true

      # --- publish -------------------------------------------------------------
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=$(mktemp)
          {
            echo "Container image: \`ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}\` and \`:latest\` (private repo — \`docker login ghcr.io\` with a PAT that has \`read:packages\` first)."
            echo
            echo "Controller host quick start: download \`install.sh\` from this release and run \`sudo GITHUB_TOKEN=<pat> ./install.sh $GITHUB_REF_NAME\`."
            echo
            echo "Windows nodes: run \`install-agent.ps1\` elevated with \`-ControllerUrl\` and a pairing code from UI → Nodes."
            echo "Linux nodes: run \`install-agent.sh\` as root with \`-c <controller-url>\` and a pairing code (\`-p\`) or token (\`-t\`) from UI → Nodes."
            echo
            echo "---"
            echo
          } > "$NOTES_FILE"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" -q .body >> "$NOTES_FILE" || true
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            "dist/encode-system-${{ steps.ver.outputs.version }}-deploy.tar.gz" \
            dist/controller \
            dist/encode-agent.exe \
            dist/encode-agent-linux-amd64 \
            dist/install.sh \
            dist/install-agent.ps1 \
            dist/install-agent.sh \
            dist/SHA256SUMS

      # Signed build provenance for the release binaries. SHA256SUMS ships
      # inside the same release it verifies (tamper-consistent), so the
      # attestation chain — signed by GitHub Actions via OIDC — is the real
      # root of trust for what a tag produced.
      - name: Attest build provenance (binaries)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/controller
            dist/encode-agent.exe
            dist/encode-agent-linux-amd64
            dist/encode-system-${{ steps.ver.outputs.version }}-deploy.tar.gz

      - name: Upload UI bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ steps.ver.outputs.version }}
          path: dist/ui/
          if-no-files-found: error
