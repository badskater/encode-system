# encode-system controller — runtime compose.
#
# Runs the pre-built release image (GHCR) or, on hosts that cannot pull it
# (private repo without login, air-gapped LAN), builds docker/Dockerfile.runtime
# from the bundle files sitting next to this file.
#
# Quick start:
#   cp .env.example .env    # edit admin password / port
#   docker compose pull controller || docker compose build controller
#   docker compose up -d
#
# Storage: by default scripts/ and release/ are plain named volumes — enough
# to try the system out. For real deployments point the controller at your
# storage from the UI (Settings → Storage shares): NFS/SMB mounts via the
# provisioning playbooks, or S3 (MinIO / Ceph RGW / AWS) which needs NO host
# mounts at all — the scanner lists the bucket and agents stage per job.
#
# --- Postgres backend (optional) -------------------------------------------
# The default backend is SQLite (state lives in the encode-state volume). To
# run the controller against Postgres instead:
#   1. Set ENCODE_DATABASE_URL in .env (see .env.example), e.g.
#      ENCODE_DATABASE_URL=postgres://encode:secret@postgres:5432/encode?sslmode=disable
#   2. Bring up the postgres profile + controller together:
#      docker compose --profile postgres up -d
# The postgres service is profile-gated (profiles: [postgres]) so the default
# `docker compose up -d` is byte-identical to the SQLite-only deploy. The
# controller does NOT hard-depend_on postgres: a non-profiled service may not
# depend_on a profiled one (compose errors in default mode), so the ordering is
# handled by bringing the profile up explicitly (postgres's healthcheck makes
# it ready before the controller connects; the controller fail-fast-exits if
# PG is unreachable, so a misordered `up` self-corrects on the retry).
# install.sh --postgres automates all of this.
services:
  controller:
    image: ghcr.io/badskater/encode-system:${ENCODE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: ${ENCODE_CONTAINER_NAME:-encode-controller}
    restart: unless-stopped
    ports:
      # Security (audit 2026-10): the API is reachable by anything that can
      # route to this host. Default stays 0.0.0.0 (nodes on the LAN need it);
      # behind a reverse proxy set ENCODE_BIND_ADDR=127.0.0.1 in .env.
      - "${ENCODE_BIND_ADDR:-0.0.0.0}:${ENCODE_PORT:-8080}:8080"
    environment:
      ENCODE_ADMIN_USER: ${ENCODE_ADMIN_USER:-admin}
      # Initial admin password — used ONLY on the boot that creates the
      # account. Leave empty to auto-generate one (logged once at startup).
      # After first boot the hash lives in the database; rotate it from the
      # UI (Change password) and delete this line from .env.
      ENCODE_ADMIN_PASSWORD: ${ENCODE_ADMIN_PASSWORD:-}
      # Lost-password recovery hatch: with =1, ENCODE_ADMIN_PASSWORD overwrites
      # the stored hash on startup (ERROR-logged, all sessions revoked).
      ENCODE_ADMIN_FORCE_PASSWORD: ${ENCODE_ADMIN_FORCE_PASSWORD:-}
      ENCODE_DATA: /data
      ENCODE_SCRIPTS_ROOT: /data/scripts
      ENCODE_RELEASE_ROOT: /data/release
      ENCODE_SCAN_INTERVAL: ${ENCODE_SCAN_INTERVAL:-30}
      ENCODE_TASKS_BEFORE_REBOOT: ${ENCODE_TASKS_BEFORE_REBOOT:-10}
      ENCODE_GROUP: ${ENCODE_GROUP:-OldFartsSubs}
      ENCODE_TAG: ${ENCODE_TAG:-1080p}
      ENCODE_DEFAULT_FLOW: ${ENCODE_DEFAULT_FLOW:-default-1080}
      ENCODE_DISCORD_WEBHOOK: ${ENCODE_DISCORD_WEBHOOK:-}
      # Postgres backend (optional): empty (the default) keeps the SQLite
      # behavior byte-for-byte. A postgres:// DSN switches the controller to
      # the Postgres store (store.Open → migratePG builds the schema fresh on
      # a new DB, no-op on an existing one). The password in the DSN is
      # stripped from logs (controller logs only scheme+host+db).
      ENCODE_DATABASE_URL: ${ENCODE_DATABASE_URL:-}
      # Shares key file location when on Postgres (SQLite keeps the key
      # beside the DB automatically). Set to a path on a mounted volume so
      # the key survives container recreation. See Docs/md/Deployment.md.
      ENCODE_SHARES_KEY_FILE: ${ENCODE_SHARES_KEY_FILE:-}
    volumes:
      # Controller state (SQLite DB + update payloads + shares key file).
      # On Postgres the DB lives in the postgres container's volume, but the
      # shares key file (ENCODE_SHARES_KEY_FILE) and update payloads still
      # live here — keep this volume in both modes.
      - encode-state:/data
      # Local scratch shares — replace with NFS/SMB volumes or switch the
      # scripts/release roles to S3 shares in the UI (no mounts needed).
      - encode-scripts:/data/scripts
      - encode-release:/data/release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Postgres backend (optional, profile-gated). NOT started by the default
  # `docker compose up -d` — only with `--profile postgres`. The controller
  # connects to it via ENCODE_DATABASE_URL (set in .env). Healthcheck makes
  # `up --profile postgres` wait for PG readiness before the controller boots.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: ${ENCODE_PG_CONTAINER_NAME:-encode-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENCODE_PG_USER:-encode}
      POSTGRES_PASSWORD: ${ENCODE_PG_PASSWORD:-changeme-encode-pg}
      POSTGRES_DB: ${ENCODE_PG_DB:-encode}
    volumes:
      - encode-pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 when PG accepts connections; matches the user/db
      # the controller will use so a half-up PG that can't serve the db
      # stays unhealthy.
      test: ["CMD-SHELL", "pg_isready -U ${ENCODE_PG_USER:-encode} -d ${ENCODE_PG_DB:-encode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  encode-state:
  encode-scripts:
  encode-release:
  encode-pgdata:
