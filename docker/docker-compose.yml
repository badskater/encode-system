# encode-system control plane.
#
# The controller container mounts the two NFS shares exported by the unRAID
# boxes — this is the "folder mapping": the scanner watches /data/scripts and
# the agents see the same files via their Windows NFS mounts at
# C:\Encodes\scripts and C:\Encodes\ReleaseFolders.
#
# Usage:
#   cp .env.example .env   # then edit
#   docker compose up -d
services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: encode-controller
    restart: unless-stopped
    ports:
      - "${ENCODE_PORT:-8080}:8080"
    environment:
      ENCODE_ADMIN_TOKEN: ${ENCODE_ADMIN_TOKEN:?set in .env}
      ENCODE_DATA: /data
      ENCODE_SCRIPTS_ROOT: /data/scripts
      ENCODE_RELEASE_ROOT: /data/release
      ENCODE_SCAN_INTERVAL: ${ENCODE_SCAN_INTERVAL:-30}
      ENCODE_TASKS_BEFORE_REBOOT: ${ENCODE_TASKS_BEFORE_REBOOT:-10}
      ENCODE_GROUP: ${ENCODE_GROUP:-OldFartsSubs}
      ENCODE_TAG: ${ENCODE_TAG:-1080p}
      ENCODE_DEFAULT_FLOW: ${ENCODE_DEFAULT_FLOW:-default-1080}
      ENCODE_DISCORD_WEBHOOK: ${ENCODE_DISCORD_WEBHOOK:-}
    volumes:
      # Controller state (SQLite DB + update payloads) — the WHOLE /data dir
      # is persistent. The NFS share mounts below are sub-mounts layered on
      # top, so scripts/release stay on the unRAID exports.
      - encode-state:/data
      # NFS shares. Compose mounts these as NFS volumes (see below); the
      # container reads/writes the same files the Windows agents see.
      - encode-scripts:/data/scripts
      - encode-release:/data/release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  encode-state:

  # NFS volume mounts — adjust the server addresses/exports to your unRAID.
  # NFSv3 is what unRAID exports by default; match your export paths.
  encode-scripts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:-unraid01},nfsvers=3,rw
      device: ":/mnt/user/encodes/scripts"
  encode-release:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:-unraid01},nfsvers=3,rw
      device: ":/mnt/user/encodes/ReleaseFolders"
