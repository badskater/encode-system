# group_vars/all.yml — non-secret deployment configuration.
---
# Controller the agents talk to.
encode_controller_url: "https://controller.homelab.example:8080"

# Windows-side paths (per project decision: tools in C:\bin, shares mounted
# under C:\Encodes).
encode_bin_dir: 'C:\bin'
encode_scripts_mount: 'C:\Encodes\scripts'
encode_release_mount: 'C:\Encodes\ReleaseFolders'
encode_agent_dir: 'C:\encode-agent'

# NFS export to mount (server:/export form). Adjust to the unRAID exports.
encode_nfs_scripts_export: "unraid01:/mnt/user/encodes/scripts"
encode_nfs_release_export: "unraid01:/mnt/user/encodes/ReleaseFolders"

# Agent rollout settings.
encode_agent_version: "0.1.0"
encode_lib_version: 1
encode_heartbeat_seconds: 15

# Reboot limit mirrored here for visibility; the controller enforces it.
encode_tasks_before_reboot: 10

# Local staging directory holding the encode binaries to copy into C:\bin.
# Populate this folder before running the bin-tools play:
#   DGIndexNV.exe, x265_x64.exe, mkvmerge.exe, ffmpeg.exe, eac3to.exe,
#   opusenc.exe, SCXvid.exe
encode_bin_staging_dir: "{{ playbook_dir }}/files/bin"
