# rotate-winrm-password.yml — rotate the WinRM account password across the fleet.
#
# Why: secrets.yml holds the account password in plaintext (local-only,
# gitignored, mode 600). Rotation should be a first-class operation, not a
# manual per-node dance — security audit 2026-10.
#
# What it does, in order:
#   1. connects with the CURRENT password from group_vars/all/secrets.yml,
#   2. sets the NEW password on the local WinRM account of every node
#      (ansible.windows.win_user),
#   3. proves the new password works by reconnecting over WinRM with it,
#   4. rewrites ansible_password in group_vars/all/secrets.yml (mode 600),
#   5. restores chmod 600 on the secrets file if it ever drifted.
#
# Safety: the secrets file is only rewritten AFTER the new password is
# verified on every node, so a failed rotation can never leave local
# management locked out. If verification fails on ANY node, the playbook
# aborts before touching secrets.yml — nodes keep the current password,
# fix the straggler and re-run (win_user is idempotent).
#
# Usage (from infra/ansible):
#   ansible-playbook -i inventory.yml rotate-winrm-password.yml
#     # interactive prompt for the new password (recommended), or:
#   ansible-playbook -i inventory.yml rotate-winrm-password.yml \
#     -e new_password='...'      # ends up in shell history — avoid
#
# Requirements: ansible.windows collection + pywinrm (the controller image
# ships both; same environment the provision engine uses).
---
- name: Rotate WinRM account password across encode nodes
  hosts: encode_nodes
  gather_facts: false

  vars_prompt:
    - name: new_password
      prompt: "New WinRM password"
      private: true
    - name: new_password_confirm
      prompt: "Confirm new WinRM password"
      private: true

  pre_tasks:
    - name: Confirmations must match
      ansible.builtin.assert:
        that: new_password == new_password_confirm
        fail_msg: "passwords do not match — nothing was changed"
        quiet: true
      run_once: true
      delegate_to: localhost

    - name: New password must be non-empty
      ansible.builtin.assert:
        that: new_password | length > 0
        fail_msg: "empty password refused"
        quiet: true
      run_once: true
      delegate_to: localhost

    - name: Set new password on the WinRM account (idempotent)
      ansible.windows.win_user:
        name: "{{ ansible_user }}"
        password: "{{ new_password }}"
        password_never_expires: true
        state: present
      no_log: true

    # Proof before persistence: reconnect with the NEW password. If this
    # fails on any node the play aborts and secrets.yml is left untouched,
    # so the fleet stays manageable with the current password.
    - name: Verify the new password authenticates over WinRM
      ansible.windows.win_shell: exit 0
      vars:
        ansible_password: "{{ new_password }}"
      no_log: true
      register: winrm_verify
      failed_when: false
      changed_when: false

    - name: Abort rotation if any node rejected the new password
      ansible.builtin.assert:
        that: winrm_verify.rc == 0
        fail_msg: >-
          new password failed verification on this node — secrets.yml was
          NOT updated; the node keeps the current password.
        quiet: true
      no_log: true

  tasks:
    # Single-writer update of the local secrets file, once per play.
    - name: Persist the new password in group_vars/all/secrets.yml
      run_once: true
      delegate_to: localhost
      no_log: true
      block:
        - name: Read current secrets file
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/group_vars/all/secrets.yml"
          register: secrets_raw

        - name: Replace ansible_password value
          ansible.builtin.copy:
            dest: "{{ playbook_dir }}/group_vars/all/secrets.yml"
            mode: "0600"
            # Only the ansible_password line is rewritten; every other key
            # (node tokens, pairing codes, ...) passes through untouched.
            # to_yaml (NOT quote — that's shell quoting) emits a properly
            # YAML-escaped scalar for any password characters.
            content: >-
              {{ secrets_raw.content | b64decode | regex_replace(
                   '(?m)^(\s*ansible_password:\s*).+$',
                   '\1' ~ new_password | to_yaml | trim) }}

        - name: Ensure secrets file stays owner-only (drift guard)
          ansible.builtin.file:
            path: "{{ playbook_dir }}/group_vars/all/secrets.yml"
            mode: "0600"
