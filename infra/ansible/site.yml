# site.yml — deploys encode-system to Windows Server 2025 encode nodes.
#
# Order matters: NFS client first (shares), then bin tools, then the agent
# service. All plays are idempotent — safe to re-run after playbook updates.
#
# Usage:
#   cp inventory.example inventory.yml        # fill real hosts/credentials
#   cp group_vars/secrets.yml.example group_vars/secrets.yml
#   ansible-playbook -i inventory.yml site.yml
---
- name: Deploy encode-system to Windows encode nodes
  hosts: encode_nodes
  gather_facts: true

  tasks:
    # --- optional WinRM HTTPS bootstrap (security audit 2026-10) -------------
    # Run over the CURRENT connection (e.g. http/5985) to add a self-signed
    # HTTPS listener on 5986. Afterwards switch inventory.yml to
    # ansible_winrm_scheme: https / ansible_port: 5986 and re-run. Off unless
    # you pass --tags winrm-https (or set encode_winrm_https=true).
    #   ansible-playbook -i inventory.yml site.yml --tags winrm-https
    # Set encode_winrm_cert_thumbprint in group_vars to reuse a CA-issued
    # cert instead of minting a self-signed one.
    - name: Enable WinRM HTTPS listener
      when: encode_winrm_https | default(false) | bool
      ansible.builtin.include_tasks:
        file: tasks/winrm-https.yml
        # `apply` propagates the tag to the dynamically-included tasks;
        # without it `--tags winrm-https` includes the file but filters out
        # its contents (dynamic includes don't inherit include-level tags).
        apply:
          tags: [winrm-https]
      tags: [winrm-https]

    - name: Include NFS client play
      ansible.builtin.import_tasks: tasks/nfs-client.yml
      tags: [nfs-client]

    - name: Include bin tools play
      ansible.builtin.import_tasks: tasks/bin-tools.yml
      tags: [bin-tools]

    - name: Include agent play
      ansible.builtin.import_tasks: tasks/agent.yml
      tags: [agent]
